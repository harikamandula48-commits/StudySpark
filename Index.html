<!DOCTYPE html>
<html>
<head>
  <title>StudySpark</title>
</head>

<body>

  <h1>📚 StudySpark</h1>
  <p>Your Smart Study Dashboard</p>

  <button id="themeBtn">🌙 Dark Mode</button>

  <h2>Today's Study Goal</h2>
  <p>Learn • Practice • Improve 🚀</p>

  <h2>My Subjects</h2>

  <button>Python</button>
  <button>Java</button>
  <button>HTML & CSS</button>
  <button>Data Structures</button>

  <h2>Today's Tasks</h2>

  <input type="checkbox"> Complete Python Practice<br>
  <input type="checkbox"> Revise Java<br>
  <input type="checkbox"> Practice HTML & CSS<br>

  <p id="progress">Progress: 0%</p>

  <h2>Study Timer ⏱️</h2>

  <p id="timer">25:00</p>

  <button id="startBtn">Start</button>
  <button id="resetBtn">Reset</button>

  <h2>Study Motivation 💡</h2>
  <p>Small progress every day becomes a big achievement!</p>

</body>
</html>
